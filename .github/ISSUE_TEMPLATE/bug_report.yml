name: Bug report
description: Something in Chorus isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the actual vs. expected behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Ideally a short Ruby snippet using Chorus that reproduces the issue.
      render: ruby
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Chorus version
      description: Output of `gem list chorus-llm` or the version pinned in your Gemfile.lock
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: ruby-version
    attributes:
      label: Ruby version
      placeholder: "3.2.3"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Stack trace, logs, or other context. Never paste your ANTHROPIC_API_KEY here.
    validations:
      required: false
